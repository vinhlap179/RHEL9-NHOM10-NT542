---
# Chuong 2 - Services (CIS RHEL 9 Benchmark v3.0.0, Level 1, Automated)
# --- 2.1.15 Ensure telnet server services are not in use
- name: 2.1.15 - Gỡ gói telnet-server
  ansible.builtin.dnf:
    name: telnet-server
    state: absent
  tags: [cis_2_1_15]

# --- 2.2.3 Ensure telnet client is not installed
- name: 2.2.3 - Gỡ gói telnet (client)
  ansible.builtin.dnf:
    name: telnet
    state: absent
  tags: [cis_2_2_3]

# --- 2.3.1 Ensure time synchronization is in use
- name: 2.3.1 - Cài đặt chrony
  ansible.builtin.dnf:
    name: chrony
    state: present
  tags: [cis_2_3_1]

# --- 2.3.2 Ensure chrony is configured
- name: 2.3.2 - Khai báo nguồn thời gian trong chrony.conf
  ansible.builtin.lineinfile:
    path: /etc/chrony.conf
    regexp: '^(pool|server)\s+'
    line: pool 2.rhel.pool.ntp.org iburst
  register: chrony_conf
  tags: [cis_2_3_2]

- name: 2.3.2 - Bật chronyd, khởi động lại nếu cấu hình thay đổi
  ansible.builtin.service:
    name: chronyd
    state: "{{ 'restarted' if chrony_conf.changed else 'started' }}"
    enabled: true
  tags: [cis_2_3_2]

# --- 2.4.1.1 Ensure cron daemon is enabled and active
- name: 2.4.1.1 - Cài cronie
  ansible.builtin.dnf:
    name: cronie
    state: present
  tags: [cis_2_4_1_1]

- name: 2.4.1.1 - Bật và chạy crond
  ansible.builtin.service:
    name: crond
    state: started
    enabled: true
  tags: [cis_2_4_1_1]
