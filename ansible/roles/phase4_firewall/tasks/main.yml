---
# Chuong 4 - Host Based Firewall (CIS RHEL 9 Benchmark v3.0.0, Level 1, Automated)
# --- 4.1.1 Ensure firewalld is installed
- name: 4.1.1 - Cài đặt firewalld
  ansible.builtin.dnf:
    name: firewalld
    state: present
  tags: [cis_4_1_1]

# --- 4.1.3 Ensure firewalld.service is configured
- name: 4.1.3 - Bật và chạy firewalld
  ansible.builtin.service:
    name: firewalld
    state: started
    enabled: true
  tags: [cis_4_1_3]

# --- 4.1.9 Ensure conflicting firewall utilities are not in use with firewalld
- name: 4.1.9 - Dừng và tắt nftables.service (nếu có)
  ansible.builtin.service:
    name: nftables
    state: stopped
    enabled: false
  register: nft
  failed_when: nft is failed and 'Could not find' not in (nft.msg | default(''))
  tags: [cis_4_1_9]

- name: 4.1.9 - Gỡ iptables-services và ufw
  ansible.builtin.dnf:
    name:
      - iptables-services
      - ufw
    state: absent
  tags: [cis_4_1_9]

# --- 4.1.10 Ensure firewalld logs denied packets
- name: 4.1.10 - Ghi log gói bị từ chối (LogDenied=all)
  ansible.builtin.lineinfile:
    path: /etc/firewalld/firewalld.conf
    regexp: '^\s*#?\s*LogDenied\s*='
    line: LogDenied=all
  register: fw_log
  tags: [cis_4_1_10]

- name: 4.1.10 - Khởi động lại firewalld khi cấu hình thay đổi
  ansible.builtin.service:
    name: firewalld
    state: restarted
  when: fw_log.changed
  tags: [cis_4_1_10]
