---
# Chuong 3 - Network (CIS RHEL 9 Benchmark v3.0.0, Level 1, Automated)
# --- 3.1.3 Ensure bluetooth services are not in use
- name: 3.1.3 - Gỡ gói bluez
  ansible.builtin.dnf:
    name: bluez
    state: absent
  tags: [cis_3_1_3]

# --- 3.3.1.1 Ensure net.ipv4.ip_forward is configured
- name: 3.3.1.1 - Đặt net.ipv4.ip_forward = 0
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "0"
    sysctl_file: /etc/sysctl.d/60-netipv4_sysctl.conf
    sysctl_set: true
    reload: true
    state: present
  tags: [cis_3_3_1_1]

# --- 3.3.1.12 Ensure net.ipv4.conf.all.rp_filter is configured
- name: 3.3.1.12 - Đặt net.ipv4.conf.all.rp_filter = 1
  ansible.posix.sysctl:
    name: net.ipv4.conf.all.rp_filter
    value: "1"
    sysctl_file: /etc/sysctl.d/60-netipv4_sysctl.conf
    sysctl_set: true
    reload: true
    state: present
  tags: [cis_3_3_1_12]

# --- 3.3.1.18 Ensure net.ipv4.tcp_syncookies is configured
- name: 3.3.1.18 - Đặt net.ipv4.tcp_syncookies = 1
  ansible.posix.sysctl:
    name: net.ipv4.tcp_syncookies
    value: "1"
    sysctl_file: /etc/sysctl.d/60-netipv4_sysctl.conf
    sysctl_set: true
    reload: true
    state: present
  tags: [cis_3_3_1_18]
